name: Не давать Supabase засыпать

# Бесплатные проекты Supabase приостанавливаются после недели без обращений.
# Раз в три дня делаем безобидный запрос к API.
# Нужны секреты репозитория SUPABASE_URL и SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions).
# Без них workflow просто пропускается.

on:
  schedule:
    - cron: '17 5 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Запрос к API
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Секреты не заданы, пропускаю"; exit 0; fi
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" "$URL/auth/v1/health" -H "apikey: $KEY"
