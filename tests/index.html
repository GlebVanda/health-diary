    <title>Тесты</title>
    <style>
      :root { --bg: #fff; --text: #17201c; --ok: #2e7d32; --fail: #b3261e; --muted: #5d6b65; color-scheme: light; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f1412; --text: #e6ece9; --ok: #7ccf80; --fail: #f2867d; --muted: #97a59f; color-scheme: dark; } }
      body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; margin: 0 auto; padding: 16px; max-width: 900px; }
      h1 { font-size: 20px; } h2 { font-size: 15px; margin: 18px 0 6px; }
      ul { margin: 0; padding-left: 18px; list-style: none; }
      .ok { color: var(--ok); } .fail { color: var(--fail); font-weight: 600; }
      .err { color: var(--muted); font-weight: 400; font-size: 13px; }
      .summary { padding: 10px 12px; border-radius: 10px; font-weight: 700; }
      .summary.good { background: color-mix(in srgb, var(--ok) 15%, transparent); }
      .summary.bad { background: color-mix(in srgb, var(--fail) 15%, transparent); }
    </style>
  </head>
